<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AURELIS Admin</title>
<style>
:root{--bg:#0b0b0c;--ch:#151516;--tx:#e9e4dc;--mu:#8f8a82;--gd:#d8c39a;--ln:rgba(216,195,154,.2);--er:#d9534f}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 4vw;border-bottom:1px solid var(--ln)}.logo{letter-spacing:.4em;color:var(--gd);font-family:Georgia,serif;font-size:20px}
main{padding:30px 4vw;max-width:1200px;margin:auto}h1{font:300 30px Georgia,serif;margin-bottom:6px}.sub{color:var(--mu);margin-bottom:24px}
button,.b{background:none;border:1px solid var(--gd);color:var(--gd);padding:9px 18px;cursor:pointer;font:inherit;letter-spacing:.06em}button:hover{background:var(--gd);color:#0b0b0c}button.s{padding:5px 10px;font-size:12px;border-color:var(--ln);color:var(--tx)}button.s:hover{border-color:var(--gd);background:none;color:var(--gd)}button.d{border-color:var(--er);color:var(--er)}button.d:hover{background:var(--er);color:#fff}
input,select,textarea{width:100%;background:var(--ch);border:1px solid var(--ln);color:var(--tx);padding:10px;font:inherit}input:focus,select:focus,textarea:focus{outline:1px solid var(--gd)}label{display:block;color:var(--mu);font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin:14px 0 5px}
table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}th{color:var(--mu);font-weight:400;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
td input{width:90px;padding:6px}.th{width:56px;height:56px;object-fit:cover;background:var(--ch);border:1px solid var(--ln)}.tag{font-size:11px;padding:2px 8px;border:1px solid var(--ln);letter-spacing:.08em;text-transform:uppercase}.tag.published{color:#7fd28f;border-color:#7fd28f}.tag.archived{color:var(--mu)}.act{display:flex;gap:6px;flex-wrap:wrap}
.wrap{overflow-x:auto}#login{max-width:380px;margin:14vh auto;padding:0 5vw}.er{color:var(--er);min-height:20px;margin-top:10px}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;overflow:auto;z-index:5;padding:4vh 4vw}#ed.o{display:block}.pn{background:#111112;border:1px solid var(--ln);max-width:760px;margin:auto;padding:28px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:600px){.g2{grid-template-columns:1fr}}
.im{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.im div{width:92px;text-align:center}.im img{width:92px;height:92px;object-fit:cover;border:1px solid var(--ln)}.im .m img{border-color:var(--gd)}.row{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}.ck{display:flex;gap:10px;align-items:center;margin-top:14px;color:var(--tx);text-transform:none;letter-spacing:0;font-size:14px}.ck input{width:auto}
#ts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gd);color:#000;padding:10px 22px;display:none;z-index:9}
</style></head><body>
<div id="login" hidden><div class="logo" style="margin-bottom:30px">AURELIS</div><h1>Admin sign in</h1><p class="sub">Private area for the store owner.</p><form id="lf"><label for="le">Email</label><input id="le" type="email" autocomplete="username" required><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required><div class="er" id="le2"></div><button style="margin-top:14px;width:100%">Sign in</button></form></div>
<div id="app" hidden><header><span class="logo">AURELIS · ADMIN</span><span><a class="b" href="/" target="_blank" style="text-decoration:none;margin-right:8px">View site</a><button id="lo">Sign out</button></span></header>
<main><div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:14px"><div><h1>Products</h1><p class="sub" style="margin:0">Changes appear on the public website immediately.</p></div><button id="add">+ Add product</button></div><div class="wrap"><table><thead><tr><th></th><th>Name</th><th>Category</th><th>Price (USD)</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></main></div>
<div id="ed"><div class="pn"><h1 id="et">Add product</h1><form id="pf"><label for="fn">Product name</label><input id="fn" maxlength="100" required>
<div class="g2"><div><label for="fp">Price (USD)</label><input id="fp" type="number" min="1" step="1" required></div><div><label for="fs">Stock quantity</label><input id="fs" type="number" min="0" step="1" value="1" required></div>
<div><label for="fc">Category</label><input id="fc" list="cl" value="Automatic"><datalist id="cl"><option>Automatic<option>Chronograph<option>Dress<option>Sport<option>Limited</datalist></div><div><label for="fo">Collection</label><select id="fo"><option value="">None<option>Classic<option>Chronograph<option>Signature<option>Nocturne</select></div></div>
<label for="fd">Description</label><textarea id="fd" rows="4"></textarea><label for="fx">Specifications — one per line, “Label: value”</label><textarea id="fx" rows="6" placeholder="Movement: Automatic&#10;Case: 42 mm rose gold&#10;Crystal: Sapphire&#10;Water resistance: 100 m"></textarea>
<label>Images (first image is the main one)</label><div class="im" id="im"></div><input id="fi" type="file" accept="image/*" multiple style="margin-top:10px">
<label for="fst">Status</label><select id="fst"><option value="published">Published (visible on the website)<option value="draft">Draft (hidden)<option value="archived">Archived (hidden)</select><label class="ck"><input id="ff" type="checkbox"> Featured product (shown first on the home page)</label>
<div class="er" id="pe"></div><div class="row"><button type="button" id="cx">Cancel</button><button id="sv">Save product</button></div></form></div></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,m='GET',b){try{const r=await fetch(u,{method:m,credentials:'same-origin',headers:m=='GET'?{}:{'Content-Type':'application/json'},body:m=='GET'?undefined:JSON.stringify(b||{})});let d={};try{d=await r.json()}catch{}return{ok:r.ok,s:r.status,d}}catch{return{ok:false,s:0,d:{error:'Cannot reach the server. Run “npm start”.'}}}}
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
let L=[],cur=null,imgs=[];
async function load(){const r=await api('/api/admin/products');if(r.s==401||!r.ok&&r.s!=0){$('#app').hidden=true;$('#login').hidden=false;return}if(!r.ok){$('#login').hidden=false;$('#le2').textContent=r.d.error;return}$('#login').hidden=true;$('#app').hidden=false;L=r.d.products;draw()}
function draw(){$('#tb').innerHTML=L.slice().sort((a,b)=>b.id-a.id).map(p=>`<tr><td>${p.images[0]?`<img class="th" src="${esc(p.images[0])}" alt="">`:'<div class="th"></div>'}</td><td><b>${esc(p.name)}</b>${p.featured?' ★':''}<br><small style="color:var(--mu)">${esc(p.collection||'')}</small></td><td>${esc(p.category)}</td><td><input type="number" min="1" value="${p.price}" onchange="qs(${p.id},'price',this.value)" aria-label="Price"></td><td><input type="number" min="0" value="${p.stock}" onchange="qs(${p.id},'stock',this.value)" aria-label="Stock"></td><td><span class="tag ${p.status}">${p.status}</span></td><td><div class="act"><button class="s" onclick="ed(${p.id})">Edit</button><button class="s" onclick="qs(${p.id},'status','${p.status=='published'?'draft':'published'}')">${p.status=='published'?'Unpublish':'Publish'}</button>${p.status=='archived'?'':`<button class="s" onclick="qs(${p.id},'status','archived')">Archive</button>`}<button class="s d" onclick="dl(${p.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--mu)">No products yet.</td></tr>'}
async function qs(id,k,v){const r=await api('/api/admin/products/'+id,'PUT',{[k]:v});if(!r.ok)toast(r.d.error||'Failed');else{toast('Saved');}load()}
async function dl(id){const p=L.find(x=>x.id==id);if(!confirm('Permanently delete “'+p.name+'”? Use Archive if you may want it back.'))return;const r=await api('/api/admin/products/'+id,'DELETE');toast(r.ok?'Deleted':r.d.error);load()}
function di(){$('#im').innerHTML=imgs.map((u,i)=>`<div class="${i?'':'m'}"><img src="${esc(u)}" alt=""><button type="button" class="s" onclick="mk(${i})">${i?'Make main':'Main'}</button><button type="button" class="s d" onclick="imgs.splice(${i},1);di()">Remove</button></div>`).join('')}
function mk(i){imgs.unshift(...imgs.splice(i,1));di()}
function ed(id){cur=id==null?null:L.find(x=>x.id==id);const p=cur||{name:'',price:'',stock:1,category:'Automatic',collection:'',description:'',specs:[],images:[],featured:false,status:'published'};
 $('#et').textContent=cur?'Edit product':'Add product';$('#fn').value=p.name;$('#fp').value=p.price;$('#fs').value=p.stock;$('#fc').value=p.category;$('#fo').value=p.collection||'';$('#fd').value=p.description;$('#fx').value=p.specs.map(s=>s[0]+': '+s[1]).join('\n');$('#fst').value=p.status;$('#ff').checked=p.featured;imgs=[...p.images];di();$('#pe').textContent='';$('#ed').classList.add('o')}
function small(f){return new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.86))};i.onerror=()=>no();i.src=u})}
$('#fi').onchange=async e=>{for(const f of e.target.files){try{const r=await api('/api/admin/upload','POST',{data:await small(f)});if(r.ok){imgs.push(r.d.url);di()}else toast(r.d.error)}catch{toast('Could not read '+f.name)}}e.target.value=''}
$('#pf').onsubmit=async e=>{e.preventDefault();const b={name:$('#fn').value,price:$('#fp').value,stock:$('#fs').value,category:$('#fc').value,collection:$('#fo').value,description:$('#fd').value,specs:$('#fx').value.split('\n').map(l=>{const i=l.indexOf(':');return i>0?[l.slice(0,i),l.slice(i+1)]:null}).filter(Boolean),images:imgs,status:$('#fst').value,featured:$('#ff').checked};
 const r=cur?await api('/api/admin/products/'+cur.id,'PUT',b):await api('/api/admin/products','POST',b);if(!r.ok){$('#pe').textContent=r.d.error||'Could not save';return}$('#ed').classList.remove('o');toast('Product saved');load()}
$('#cx').onclick=()=>$('#ed').classList.remove('o');$('#add').onclick=()=>ed(null);
$('#lf').onsubmit=async e=>{e.preventDefault();const r=await api('/api/admin/login','POST',{email:$('#le').value,password:$('#lp').value});if(!r.ok){$('#le2').textContent=r.d.error;return}$('#lp').value='';load()};
$('#lo').onclick=async()=>{await api('/api/admin/logout','POST');load()};load();
</script></body></html>
